name: Track Jobs

on:
  schedule:
  - cron: "0 9 * * *"
  # Scheduled workflows are disabled automatically after 60 days without
  # repository activity, and this job silently stopped running for months once
  # that happened. Keep a manual trigger so it can always be kicked off again.
  workflow_dispatch:
    inputs:
      preview:
        description: Render the current crawl as tomorrow's point without changing history
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: track-jobs
  cancel-in-progress: false

jobs:
  report_total_jobs:
    name: Record total job postings
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 360 minutes. The crawler gets 350 so
    # cancellation can unwind and the manifest, chart, artifact, and commit
    # still have time to finish.
    timeout-minutes: 360
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Install gnuplot
      run: |
        sudo apt-get update
        sudo apt-get install -y gnuplot

    - name: Build
      run: go build -o job-hunter-toolkit .

    - name: Count job postings
      id: count
      env:
        PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
      run: |
        set -euo pipefail

        DATE=$(date "+%m/%d/%y")
        RECORD_DATE="$DATE"
        ARTIFACT_DATE=$(date "+%Y-%m-%d")

        if [ "$PREVIEW" = "true" ]; then
          RECORD_DATE=$(date -d tomorrow "+%m/%d/%y")
          ARTIFACT_DATE=$(date -d tomorrow "+%Y-%m-%d")
        fi

        echo "date=$RECORD_DATE" >> "$GITHUB_OUTPUT"
        echo "artifact_date=$ARTIFACT_DATE" >> "$GITHUB_OUTPUT"

        # Skip if this date is already recorded, so a re-run or a manual
        # dispatch cannot double-count a day.
        if [ "$PREVIEW" != "true" ] && grep -q "^$RECORD_DATE " jobs_record.txt; then
          echo "already recorded for $RECORD_DATE"
          echo "recorded=false" >> "$GITHUB_OUTPUT"
          echo "preview=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # `total` writes the header to stderr and the data row to stdout, so
        # only the row lands in the record file.
        #
        # Retain a deadline snapshot only when it is explicitly labelled
        # partial. The plot renders partial observations as isolated diamonds,
        # never as part of the completed-crawl trend line.
        if ! ./job-hunter-toolkit total \
          --timeout=350m \
          --allow-partial \
          --manifest=crawl-manifest.json \
          --log-level=info \
          --log-format=json \
          > total.txt; then
          echo "::error::crawl failed before it could produce a record"
          cat total.txt || true
          exit 1
        fi

        cat total.txt

        # Guard against recording a truncated or empty crawl as a real
        # data point, a bogus zero would corrupt the trend line permanently.
        POSTINGS=$(awk '{print $2}' total.txt)
        SOURCES=$(awk '{print $3}' total.txt)
        STATUS=$(awk '{print $4}' total.txt)

        if [ -z "$POSTINGS" ] || [ "$POSTINGS" -lt 1000 ]; then
          echo "::error::refusing to record implausible posting count: '$POSTINGS'"
          exit 1
        fi
        if [ "$STATUS" != "complete" ] && [ "$STATUS" != "partial" ]; then
          echo "::error::refusing to record unknown crawl status: '$STATUS'"
          exit 1
        fi
        if [ "$STATUS" = "partial" ]; then
          echo "::warning::recording a deadline snapshot; the chart will mark it as partial"
        fi

        if [ "$PREVIEW" = "true" ]; then
          # Never mutate the historical series for a preview. Replace any
          # existing row for tomorrow only in a temporary copy so rerunning the
          # preview remains deterministic.
          awk -v date="$RECORD_DATE" '$1 != date' jobs_record.txt > jobs_record-preview.txt
          printf '%s %s %s\n' "$RECORD_DATE" "$POSTINGS" "$SOURCES" >> jobs_record-preview.txt
          echo "preview=true" >> "$GITHUB_OUTPUT"
          echo "recorded=false" >> "$GITHUB_OUTPUT"
        else
          cat total.txt >> jobs_record.txt
          echo "preview=false" >> "$GITHUB_OUTPUT"
          echo "recorded=true" >> "$GITHUB_OUTPUT"
        fi

        echo "postings=$POSTINGS" >> "$GITHUB_OUTPUT"
        echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

    - name: Summarize crawl diagnostics
      if: always()
      run: |
        if [ ! -f crawl-manifest.json ]; then
          echo "No crawl manifest was produced." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        python3 - <<'PY'
        import json
        import os

        with open("crawl-manifest.json", encoding="utf-8") as stream:
            manifest = json.load(stream)

        def cell(value):
            return str(value).replace("|", "\\|").replace("\n", " ")

        duration = manifest["duration_ms"] / 1000
        counts = manifest["source_counts"]
        sources = manifest["sources"]
        slowest = sorted(
            (source for source in sources if source.get("duration_ms", 0) > 0),
            key=lambda source: source["duration_ms"],
            reverse=True,
        )[:15]

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("## Crawl result\n\n")
            summary.write(
                f"**{manifest['status']}** — {manifest['postings']:,} postings "
                f"from {manifest['companies']:,} companies in {duration:,.1f}s.\n\n"
            )
            summary.write("| Source outcome | Count |\n| --- | ---: |\n")
            for status in ("complete", "failed", "truncated", "stopped", "running", "planned"):
                summary.write(f"| {status} | {counts.get(status, 0):,} |\n")

            summary.write("\n### Slowest sources\n\n")
            summary.write("| Platform | Company | Status | Seconds | Postings | Errors |\n")
            summary.write("| --- | --- | --- | ---: | ---: | ---: |\n")
            for source in slowest:
                summary.write(
                    f"| {cell(source['platform'])} | {cell(source['company'])} | "
                    f"{cell(source['status'])} | {source['duration_ms'] / 1000:,.1f} | "
                    f"{source['postings']:,} | {source['errors']:,} |\n"
                )
        PY

    - name: Upload crawl diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: crawl-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          crawl-manifest.json
          total.txt
        if-no-files-found: warn
        retention-days: 14

    - name: Regenerate historical plot
      if: steps.count.outputs.recorded == 'true'
      run: gnuplot jobs_record.gnuplot

    - name: Render preview plot
      if: steps.count.outputs.preview == 'true'
      run: |
        gnuplot \
          -e "datafile='jobs_record-preview.txt'; outputfile='jobs_record-preview.png'" \
          jobs_record.gnuplot

    - name: Upload preview
      if: steps.count.outputs.preview == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: jobs-record-preview-${{ steps.count.outputs.artifact_date }}
        path: jobs_record-preview.png
        if-no-files-found: error
        retention-days: 7

    - name: Commit and push
      if: steps.count.outputs.recorded == 'true'
      env:
        DATE: ${{ steps.count.outputs.date }}
        POSTINGS: ${{ steps.count.outputs.postings }}
        SOURCES: ${{ steps.count.outputs.sources }}
        STATUS: ${{ steps.count.outputs.status }}
      run: |
        set -euo pipefail

        git config user.name "Job Hunter Toolkit Bot"
        git config user.email "job-hunter-toolkit@users.noreply.github.com"

        git add jobs_record.txt jobs_record.png

        # Nothing to do if the crawl produced no change, rather than failing the
        # run on an empty commit.
        if git diff --cached --quiet; then
          echo "no changes to commit"
          exit 0
        fi

        git commit -m "update jobs_record.txt for $DATE with $POSTINGS jobs from $SOURCES sources ($STATUS)"
        git push origin HEAD:master
