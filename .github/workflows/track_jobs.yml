name: Track Jobs

on:
  schedule:
  - cron: "0 9 * * *"
  # Scheduled workflows are disabled automatically after 60 days without
  # repository activity, and this job silently stopped running for months once
  # that happened. Keep a manual trigger so it can always be kicked off again.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-jobs
  cancel-in-progress: false

jobs:
  report_total_jobs:
    name: Record total job postings
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Install gnuplot
      run: |
        sudo apt-get update
        sudo apt-get install -y gnuplot

    - name: Build
      run: go build -o job-hunter-toolkit .

    - name: Count job postings
      id: count
      run: |
        set -euo pipefail

        DATE=$(date "+%m/%d/%y")
        echo "date=$DATE" >> "$GITHUB_OUTPUT"

        # Skip if this date is already recorded, so a re-run or a manual
        # dispatch cannot double-count a day.
        if grep -q "^$DATE " jobs_record.txt; then
          echo "already recorded for $DATE"
          echo "recorded=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # `total` writes the header to stderr and the data row to stdout, so
        # only the row lands in the record file.
        #
        # It exits non-zero if the crawl did not finish inside the time budget.
        # That row must be discarded rather than recorded: a partial count would
        # look like a real drop in the trend, which is exactly the kind of silent
        # data corruption this record has suffered before.
        if ! ./job-hunter-toolkit total --timeout=75m > total.txt; then
          echo "::error::crawl did not complete; refusing to record a partial count"
          cat total.txt || true
          exit 1
        fi

        cat total.txt

        # Guard against recording a truncated or empty crawl as a real
        # data point, a bogus zero would corrupt the trend line permanently.
        POSTINGS=$(awk '{print $2}' total.txt)
        SOURCES=$(awk '{print $3}' total.txt)

        if [ -z "$POSTINGS" ] || [ "$POSTINGS" -lt 1000 ]; then
          echo "::error::refusing to record implausible posting count: '$POSTINGS'"
          exit 1
        fi

        cat total.txt >> jobs_record.txt

        echo "postings=$POSTINGS" >> "$GITHUB_OUTPUT"
        echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
        echo "recorded=true" >> "$GITHUB_OUTPUT"

    - name: Regenerate plot
      if: steps.count.outputs.recorded == 'true'
      run: gnuplot jobs_record.gnuplot

    - name: Commit and push
      if: steps.count.outputs.recorded == 'true'
      env:
        DATE: ${{ steps.count.outputs.date }}
        POSTINGS: ${{ steps.count.outputs.postings }}
        SOURCES: ${{ steps.count.outputs.sources }}
      run: |
        set -euo pipefail

        git config user.name "Job Hunter Toolkit Bot"
        git config user.email "job-hunter-toolkit@users.noreply.github.com"

        git add jobs_record.txt jobs_record.png

        # Nothing to do if the crawl produced no change, rather than failing the
        # run on an empty commit.
        if git diff --cached --quiet; then
          echo "no changes to commit"
          exit 0
        fi

        git commit -m "update jobs_record.txt for $DATE with $POSTINGS total jobs from $SOURCES sources"
        git push origin HEAD:master
